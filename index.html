<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Solar</title>
  </head>
  <body>
    <div id="app">
      <h1>Calculadora Solar</h1>

      <form id="city-form">
        <label>
          Ciudad
          <input type="text" id="city" placeholder="Ej: Rosario" autocomplete="off" />
        </label>
        <button type="submit">Buscar</button>
      </form>
      <ul id="city-results" hidden></ul>

      <form id="coords-form">
        <label>
          Latitud
          <input type="number" id="lat" step="0.0001" value="-34.6037" required />
        </label>
        <label>
          Longitud
          <input type="number" id="lng" step="0.0001" value="-58.3816" required />
        </label>
        <button type="submit">Calcular</button>
      </form>

      <section id="today">
        <h2>Hoy</h2>
        <p>Salida del sol: <span id="sunrise">-</span></p>
        <p>Puesta del sol: <span id="sunset">-</span></p>
      </section>

      <section id="chart-section">
        <h2>A lo largo del año</h2>
        <canvas id="sunset-chart"></canvas>
        <canvas id="sunrise-chart"></canvas>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
